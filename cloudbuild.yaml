steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/storedatabase', '-f', './Dockerfile', '.']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/storedatabase']
  
  - name: 'gcr.io/cloud-builders/run'
    args:
      - 'deploy'
      - 'storedatabase'
      - '--image=gcr.io/$PROJECT_ID/storedatabase'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--set-env-vars=MONGODB_URI=mongodb+srv://nithin:nithin19@cluster0.c95nbs3.mongodb.net/?appName=Cluster0,NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/storedatabase'

options:
  machineType: 'N1_HIGHCPU_8'






